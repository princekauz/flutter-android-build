<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flutter Android APK build status and download dashboard" />
  <title>Flutter APK Builds — Status & Downloads</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2302569B' d='M14.5 1.5L22 9l-7.5 7.5L7 9l7.5-7.5zM1.5 14.5L9 22l-7.5-7.5L9 7l-7.5 7.5z'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⚡</span>
      <div>
        <h1 id="repo-title">Flutter APK Builds</h1>
        <p class="subtitle" id="repo-subtitle">Build status, history & download portal</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a id="repo-link" href="#" target="_blank" rel="noopener" class="btn btn-ghost">
        <span>📂</span> Source repo
      </a>
      <button id="refresh-btn" class="btn btn-primary" title="Re-fetch status">
        <span id="refresh-icon">🔄</span> Refresh
      </button>
    </div>
  </header>

  <main class="container">

    <!-- Loading state -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Fetching latest build status…</p>
    </div>

    <!-- Error state -->
    <div id="error-banner" class="error-banner hidden" role="alert"></div>

    <!-- Main dashboard -->
    <section id="dashboard" class="hidden">

      <!-- Latest build card -->
      <section class="card latest-card">
        <div class="card-header">
          <h2>Latest build</h2>
          <span id="latest-conclusion" class="badge"></span>
        </div>
        <div id="latest-body" class="latest-body"></div>
        <div id="latest-downloads" class="download-grid"></div>
      </section>

      <!-- Stats row -->
      <section class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total builds</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Success rate</div>
          <div class="stat-value" id="stat-success">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg build time</div>
          <div class="stat-value" id="stat-avg-time">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last successful</div>
          <div class="stat-value" id="stat-last-success">—</div>
        </div>
      </section>

      <!-- History -->
      <section class="card">
        <div class="card-header">
          <h2>Build history</h2>
          <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="success">✓ Success</button>
            <button class="filter-btn" data-filter="failure">✗ Failed</button>
          </div>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <!-- Build details modal -->
      <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-backdrop" data-close-modal></div>
        <div class="modal-panel">
          <div class="modal-header">
            <h3 id="modal-title">Build details</h3>
            <button class="modal-close" data-close-modal aria-label="Close">×</button>
          </div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>

    </section>

  </main>

  <footer class="footer">
    <p>
      Built by <a href="https://github.com/features/actions" target="_blank" rel="noopener">GitHub Actions</a>.
      Auto-refreshes every 60 seconds.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

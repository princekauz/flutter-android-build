name: ai_assistant
description: "AI-powered personal productivity app — chat, calendar, lists."
publish_to: 'none'
version: 0.3.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2.x (no codegen)
  flutter_riverpod: ^2.5.1

  # Local persistence — sqflite (raw SQLite, no codegen required).
  # Phase 1: just chat_messages. Phase 2 adds other tables.
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Date / time helpers
  intl: ^0.19.0

  # AI backend — hidden WebView wrapping QuillBot's internal API
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

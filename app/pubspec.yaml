name: ai_assistant
description: "AI-powered personal productivity app — chat, calendar, lists."
publish_to: 'none'
version: 0.1.0+0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2.x (no codegen for Phase 0)
  flutter_riverpod: ^2.5.1

  # Date / time helpers
  intl: ^0.19.0

  # AI backend — hidden WebView wrapping QuillBot's internal API
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: Build Flutter Android APK

on:
  # Trigger on every push to main
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab (useful when iterating locally)
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Flutter build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - profile
          - debug
      split_per_abi:
        description: 'Build separate APKs per ABI (smaller files)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  # Cancel any in-flight build when a new push arrives — saves CI minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.3"
  JAVA_VERSION: "17"

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Build the APK. No dashboard deploy — Asad installs manually.
  # ────────────────────────────────────────────────────────────────────
  build:
    name: Build APK (${{ github.event.inputs.build_mode || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read   # only need to read the repo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle*', 'app/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate local.properties (points Gradle at Flutter SDK)
        working-directory: app/android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}" > local.properties
          echo "flutter.sdk=${FLUTTER_ROOT:-/opt/hostedtoolcache/flutter/stable-${FLUTTER_VERSION}-x64/flutter}" >> local.properties
          cat local.properties

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: flutter test (best-effort)
        working-directory: app
        run: flutter test --no-pub --reporter expanded
        continue-on-error: true

      - name: Determine build flags
        id: flags
        run: |
          MODE="${{ github.event.inputs.build_mode || 'release' }}"
          SPLIT="${{ github.event.inputs.split_per_abi || 'true' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "split=$SPLIT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: app
        run: |
          MODE="${{ steps.flags.outputs.mode }}"
          SPLIT="${{ steps.flags.outputs.split }}"

          # We don't `set -e` because Flutter 3.24 sometimes exits non-zero
          # with a benign "Already watching path" file-watcher race AFTER
          # successfully producing the APK files. We verify the output
          # exists below to confirm real success.
          if [ "$SPLIT" = "true" ]; then
            flutter build apk \
              --$MODE \
              --split-per-abi \
              --build-name="$GITHUB_RUN_NUMBER" \
              --build-number="$GITHUB_RUN_NUMBER" || true
          else
            flutter build apk \
              --$MODE \
              --build-name="$GITHUB_RUN_NUMBER" \
              --build-number="$GITHUB_RUN_NUMBER" || true
          fi

          if [ ! -d build/app/outputs/flutter-apk ] || [ -z "$(ls -A build/app/outputs/flutter-apk/*.apk 2>/dev/null)" ]; then
            echo "::error::No APKs were produced."
            exit 1
          fi

          echo "--- APKs produced ---"
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;

      - name: Compute APK metadata (size + SHA256)
        working-directory: app
        run: |
          mkdir -p ../build-info
          cd build/app/outputs/flutter-apk
          APKS_FILE="$(realpath ../../../../../build-info/apks.txt)"
          : > "$APKS_FILE"
          for apk in *.apk; do
            SIZE=$(stat -c%s "$apk")
            SHA=$(sha256sum "$apk" | awk '{print $1}')
            PKG=$(aapt dump badging "$apk" 2>/dev/null | grep '^package:' | head -1 | sed -E "s/.*name='([^']+)'.*/\1/")
            VER=$(aapt dump badging "$apk" 2>/dev/null | grep '^package:' | head -1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
            echo "${apk}|${SIZE}|${SHA}|${PKG}|${VER}" >> "$APKS_FILE"
          done
          echo "wrote:"
          cat "$APKS_FILE"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apks-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/app"
          {
            echo "## Build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Commit | \`${{ github.event.head_commit.message }}\` |"
            echo "| Author | ${{ github.event.head_commit.author.name }} |"
            echo "| Mode | ${{ steps.flags.outputs.mode }} (split-per-ABI: ${{ steps.flags.outputs.split }}) |"
            echo "| Flutter | ${{ env.FLUTTER_VERSION }} |"
            echo "| Conclusion | ${{ job.status }} |"
            echo ""
            echo "### Artifacts"
            echo ""
            ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null | awk '{print "- `"$NF"` — "$5}' || echo "_No APKs produced._"
            echo ""
            echo "📥 **[Download from Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**"
          } >> "$GITHUB_STEP_SUMMARY"
